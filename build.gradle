plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
	maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases" }
	maven { name = "Ladysnake Libs"; url = "https://maven.ladysnake.org/releases" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Trinkets
	modImplementation "dev.emi:trinkets:${project.trinkets_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.archives_base_name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}

tasks.register('deployToPrism', Copy) {
	def prismMods = file("/home/joke/.local/share/PrismLauncher/instances/1.21.1/minecraft/mods")
	if (prismMods.exists()) {
		from remapJar
		into prismMods
	}
}
assemble.finalizedBy deployToPrism

